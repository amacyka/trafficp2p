databases:
  - name: liquidity-monitor-db
    plan: free

services:
  # Single free-tier web service: serves the dashboard AND runs the
  # collector + Telegram bot as background tasks inside the same process
  # (Render's free plan does not offer a separate background-worker type).
  - type: web
    name: liquidity-monitor-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.web:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: liquidity-monitor-db
          property: connectionString
      - key: SYMBOL
        value: TON/USDT
      - key: XRocket_API_BASE_URL
        value: https://exchange.api.xrocket.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
